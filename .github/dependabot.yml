version: 2
updates:
  # Root (Playwright E2E tooling)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5

  # Backend (NestJS)
  - package-ecosystem: npm
    directory: "/wash-and-go-backend"
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5

  # Frontend (React + Vite)
  - package-ecosystem: npm
    directory: "/wash-and-go-SE2"
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: develop
