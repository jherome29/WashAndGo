name: CI

# Branch flow: feature/* -> develop -> test -> main
# CI runs on pushes and PRs targeting all three long-lived branches.
on:
  push:
    branches: [main, test, develop]
  pull_request:
    branches: [main, test, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wash-and-go-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wash-and-go-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (no autofix in CI — fail instead of mutate)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests with coverage (Jest)
        run: npm run test:cov

      - name: Build (NestJS)
        run: npm run build

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: wash-and-go-backend/coverage/lcov.info

  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wash-and-go-SE2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wash-and-go-SE2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Typecheck (vite build does not run tsc)
        run: npx tsc --noEmit

      - name: Unit tests with coverage (Vitest)
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: Build (Vite)
        run: npm run build

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: wash-and-go-SE2/coverage/lcov.info

  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: Security · secret scan · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Gitleaks secret scan (hard gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Informational only: backend has 2 known non-actionable advisory trees
      # (js-yaml in test tooling, multer in @nestjs/platform-express with no
      # multer routes). Review the log; do not let them block every build.
      - name: npm audit — backend (informational)
        working-directory: wash-and-go-backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit — frontend (informational)
        working-directory: wash-and-go-SE2
        run: npm audit --audit-level=high
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube · code quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Skip on PRs from forks — they can't read SONAR_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: wash-and-go-backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: wash-and-go-SE2/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  # ────────────────────────────────────────────────────────────────────────────
  # Single aggregate check — set THIS as the required status check in branch
  # protection so the rule survives job renames/additions.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, sonarqube]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::One or more CI jobs failed."
              exit 1
            fi
          done
