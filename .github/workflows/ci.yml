name: CI

# Branch flow: feature/* -> develop -> main
# Feature branches PR into develop (this is where CI/tests gate the merge);
# develop PRs into main (production).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wash-and-go-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wash-and-go-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (no autofix in CI — fail instead of mutate)
        run: npx --no-install eslint "{src,apps,libs,test}/**/*.ts"

      - name: Unit tests with coverage (Jest)
        run: npm run test:cov

      - name: Build (NestJS)
        run: npm run build

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: wash-and-go-backend/coverage/lcov.info

  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wash-and-go-SE2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wash-and-go-SE2/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint flat config)
        run: npm run lint

      - name: Typecheck (vite build does not run tsc)
        run: npx --no-install tsc --noEmit

      - name: Unit tests with coverage (Vitest)
        run: npx --no-install vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: Build (Vite)
        run: npm run build

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: wash-and-go-SE2/coverage/lcov.info

  # ────────────────────────────────────────────────────────────────────────────
  security:
    name: Security · secret scan · dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history

      - name: Gitleaks secret scan (hard gate)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Informational only: backend has 2 known non-actionable advisory trees
      # (js-yaml in test tooling, multer in @nestjs/platform-express with no
      # multer routes). Review the log; do not let them block every build.
      - name: npm audit — backend (informational)
        working-directory: wash-and-go-backend
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: npm audit — frontend (informational)
        working-directory: wash-and-go-SE2
        run: npm audit --audit-level=high
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # E2E runs on develop (gates feature -> develop merges) and main, and only
  # once E2E_ENABLED=true is set as a repo variable — until then this job
  # SKIPS (not fails), so adding it now is safe. See docs/NEXT-STEPS.md for
  # the one-time test-Supabase-project setup that E2E_ENABLED depends on.
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: |
      vars.E2E_ENABLED == 'true' && (
        (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) ||
        (github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main'))
      )
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root deps (Playwright)
        run: npm ci --ignore-scripts

      - name: Install backend deps
        working-directory: wash-and-go-backend
        run: npm ci --ignore-scripts

      - name: Install frontend deps
        working-directory: wash-and-go-SE2
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      # webServer in playwright.config.ts runs `cd wash-and-go-backend && npm run start:dev`
      # and NestJS's ConfigModule reads .env from that working directory — so the file
      # must exist on disk, not just be exported as job-level env vars.
      # Secrets are passed via `env:` (not interpolated into the script text) so their
      # values are never spliced directly into the shell command.
      - name: Write backend .env (test Supabase project)
        working-directory: wash-and-go-backend
        env:
          SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY
          PORT=3001
          FRONTEND_URL=http://localhost:3000
          CORS_ORIGINS=http://localhost:3000
          EOF

      - name: Write frontend .env (test Supabase project)
        working-directory: wash-and-go-SE2
        env:
          VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          VITE_SUPABASE_URL=$VITE_SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY
          VITE_API_URL=http://localhost:3001/api
          EOF

      - name: Run Playwright E2E suite
        env:
          VITE_API_URL: http://localhost:3001/api
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          PLAYWRIGHT_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: npx --no-install playwright test

      - name: Upload Playwright report (always, for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: SonarQube · code quality gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Skip on PRs from forks — they can't read SONAR_TOKEN.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar needs full history for new-code detection

      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: wash-and-go-backend/coverage

      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: wash-and-go-SE2/coverage

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

  # ────────────────────────────────────────────────────────────────────────────
  # Single aggregate check — set THIS as the required status check in branch
  # protection so the rule survives job renames/additions.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend, security, e2e, sonarqube]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::One or more CI jobs failed."
              exit 1
            fi
          done
