name: CD

# Deploys develop -> staging and main -> production, gated on CI having passed.
# Full design: docs/CD-BLUEPRINT.md.
#
# Each job declares `environment:` explicitly so it picks up that environment's
# scoped secrets/variables (and, for production, waits on required reviewer
# approval) -- environment scoping does not propagate through `needs:`.

on:
  workflow_run:
    workflows: [CI]
    branches: [develop, main]
    types: [completed]

jobs:
  migrate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  deploy-backend:
    needs: migrate
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: npm i -g @railway/cli
      - run: railway up --service ${{ vars.RAILWAY_SERVICE_ID }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    defaults:
      run:
        working-directory: wash-and-go-SE2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: wash-and-go-SE2/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # wrangler.jsonc's "name" is fixed to the production worker -- override
      # it per-environment with --name so this same job deploys to either
      # washandgo-staging or washandgo depending on which environment ran.
      - run: npx wrangler deploy --name ${{ vars.CF_WORKER_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke-test:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      # Cold first-time deploys to a fresh Railway service can take longer
      # than a normal redeploy to actually come online; railway up --detach
      # returns as soon as the deploy is queued, not once it's live.
      - name: API health
        run: curl -sf --retry 12 --retry-delay 15 "${{ vars.API_URL }}/health"
      - name: API serves data
        run: curl -sf "${{ vars.API_URL }}/services" | grep -q '\['
      - name: Frontend up
        run: curl -sf -o /dev/null "${{ vars.FRONTEND_URL }}"
      # On failure: Railway -> redeploy previous deployment (dashboard or
      # `railway redeploy`); Cloudflare -> roll back to a previous Version on
      # the Deployments tab. Manual rollback is acceptable for v1 (see blueprint).
