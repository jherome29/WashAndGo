# SonarQube / SonarCloud project configuration (monorepo: NestJS backend + React frontend)
#
# SonarCloud (default): projectKey/organization below must match what SonarCloud
#   generates when you import the repo (Account > Your Organization > Analyze new project).
#   IMPORTANT: disable "Automatic Analysis" in SonarCloud project settings —
#   it conflicts with this CI-based analysis.
# Self-hosted SonarQube: comment out sonar.organization, create the project with
#   this key, and set the SONAR_HOST_URL secret in GitHub.

sonar.projectKey=jherome29_WashAndGo
sonar.organization=jherome29
sonar.projectName=WashAndGo

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=wash-and-go-backend/src,wash-and-go-SE2
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,wash-and-go-SE2/public/**,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.d.ts,wash-and-go-SE2/vite.config.ts,wash-and-go-SE2/eslint.config.js,wash-and-go-SE2/vitest.setup.ts

# ── Tests ────────────────────────────────────────────────────────────────────
sonar.tests=wash-and-go-backend/src,wash-and-go-SE2,e2e
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# ── Coverage (produced by CI: Jest lcov + Vitest lcov) ───────────────────────
sonar.javascript.lcov.reportPaths=wash-and-go-backend/coverage/lcov.info,wash-and-go-SE2/coverage/lcov.info

sonar.sourceEncoding=UTF-8
